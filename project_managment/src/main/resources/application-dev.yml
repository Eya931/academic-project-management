spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/project_management
    username: username
    password: password

    hikari:
      connection-init-sql: "SET password_encryption = 'scram-sha-256'"
      connection-timeout: 30000
      minimum-idle: 5
      maximum-pool-size: 20
  mvc:
    contentnegotiation:
      favor-parameter: false
      favor-path-extension: false
      default-content-type: application/json
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true  # Enable temporarily for debugging
    properties:
      hibernate:
        format_sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect


  mail:
    properties:
      mail:
        smtp:
          starttls:
            enable: false
            required: true
          auth: false
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    host: localhost
    port: 1025

application:
  security:
    jwt:
      secret-key: 
      expiration: 8640000
  mailing:
    frontend:
      activation-url: http://localhost:4200/activate-account
      activation-admin-url : http://localhost:4200/activate-account

server:
  port: 8088
app:
  first-admin:
    email: admin@gmail.com
    password: adminPassword